[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "nexus-context"
version = "0.2.1"
description = "Transparent middleware for referential integrity, KV-cache alignment, and WWW memory governance in local SLM deployments"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Laxmikant Bhagat", email = "laxmikant2806@gmail.com" },
]
maintainers = [
    { name = "Laxmikant Bhagat", email = "laxmikant2806@gmail.com" },
]
keywords = [
    "llm", "slm", "context-compression", "kv-cache", "prefix-caching",
    "vllm", "sglang", "ollama", "agent", "rag", "context-window",
    "memory", "middleware", "openai-compatible",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Framework :: FastAPI",
    "Environment :: Console",
    "Typing :: Typed",
]

# ── Core runtime dependencies (always installed) ──────────────────────────────
# Deliberately lean: no heavy ML deps at install time.
# Use extras for optional ML acceleration.
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "tiktoken>=0.7",
    "filelock>=3.14",
    "numpy>=1.26",
    "aiofiles>=23.1",
]

[project.optional-dependencies]
# NLP coreference resolution (spaCy-based NL graph edges)
nlp = [
    "spacy>=3.7",
    "coreferee>=1.4",
]
# Semantic embeddings for submodular solver
embeddings = [
    "sentence-transformers>=2.7",
    "torch>=2.1",
    "transformers>=4.40",
]
# Tree-Sitter multi-language AST parsing (Python/SQL/Bash/JS)
parsers = [
    "tree-sitter>=0.22",
    "tree-sitter-python>=0.21",
    "tree-sitter-sql>=0.2",
    "tree-sitter-bash>=0.21",
    "tree-sitter-javascript>=0.21",
]
# HNSWLib approximate nearest-neighbour vector index (optional speedup)
hnswlib = [
    "hnswlib>=0.8",
]
# Full install: all optional extras
full = [
    "nexus-context[nlp,embeddings,parsers,hnswlib]",
]
# Development / CI tooling
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.10",
    "memory-profiler>=0.61",
    "build>=1.2",
    "twine>=5.1",
]
# Benchmark / load-testing
benchmark = [
    "locust>=2.29",
    "prometheus-client>=0.20",
]

[project.scripts]
nexus-serve = "nexus_context.cache.middleware:main"

[project.urls]
Homepage      = "https://github.com/laxmikant2806/Nexus-Context"
Documentation = "https://github.com/laxmikant2806/Nexus-Context/blob/main/docs/how_it_works_simple_to_tech.md"
Repository    = "https://github.com/laxmikant2806/Nexus-Context"
"Bug Tracker" = "https://github.com/laxmikant2806/Nexus-Context/issues"
Changelog     = "https://github.com/laxmikant2806/Nexus-Context/blob/main/CHANGELOG.md"

# ── Hatch build config ────────────────────────────────────────────────────────
[tool.hatch.build.targets.wheel]
packages = ["src/nexus_context"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "docs/",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
]
exclude = [
    "*.db",
    "dist/",
    ".venv/",
    "__pycache__/",
    "*.egg-info/",
]

# ── Ruff linting ──────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "ANN", "B", "SIM", "C90"]
ignore = ["ANN101", "ANN102"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S101"]

# ── Mypy type checking ────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = false
warn_return_any = true
warn_unused_configs = true

# ── Pytest configuration ──────────────────────────────────────────────────────
[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src/nexus_context --cov-report=term-missing --cov-fail-under=85"
markers = [
    "integration: requires live backend server (vLLM, SGLang, or Ollama)",
    "requires_vllm: requires live vLLM instance with prefix caching enabled",
    "benchmark: latency and throughput benchmark tests",
]

# ── Coverage ──────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src/nexus_context"]
omit = ["tests/*", "src/nexus_context/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
