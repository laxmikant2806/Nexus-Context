[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexus-context"
version = "0.1.0"
description = "Lightweight Python framework for referential integrity, KV cache alignment, and WWW memory governance in local SLM deployments"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Nexus-Context Team" }]
keywords = ["llm", "context-compression", "kv-cache", "vllm", "sglang", "ollama", "agent", "slm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "tree-sitter>=0.21",
    "tree-sitter-python>=0.21",
    "tree-sitter-sql>=0.2",
    "tree-sitter-bash>=0.21",
    "tree-sitter-javascript>=0.21",
    "spacy>=3.0",
    "coreferee>=1.4",
    "sentence-transformers>=2.7",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "tiktoken>=0.7",
    "transformers>=4.40",
    "numpy>=1.26",
    "filelock>=3.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.10",
    "memory-profiler>=0.61",
]
benchmark = [
    "locust>=2.29",
    "prometheus-client>=0.20",
]
hnswlib = [
    "hnswlib>=0.8",
]

[project.scripts]
nexus-serve = "nexus_context.cache.middleware:main"

[project.urls]
Homepage = "https://github.com/nexus-context/nexus-context"
Documentation = "https://nexus-context.readthedocs.io"
Repository = "https://github.com/nexus-context/nexus-context"
Issues = "https://github.com/nexus-context/nexus-context/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_context"]

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "ANN", "B", "SIM", "C90"]
ignore = ["ANN101", "ANN102"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S101"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = false
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src/nexus_context --cov-report=term-missing --cov-fail-under=85"
markers = [
    "integration: requires live backend server (vLLM, SGLang, or Ollama)",
    "requires_vllm: requires live vLLM instance with prefix caching enabled",
    "benchmark: latency and throughput benchmark tests",
]

[tool.coverage.run]
source = ["src/nexus_context"]
omit = ["tests/*", "src/nexus_context/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
